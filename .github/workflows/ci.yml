name: CI

# CI runs on every pull request and every push to main.
# Java formatting check: intentionally omitted. Unlike Go (gofmt), Java has no
# standard formatting tool bundled with the toolchain; introducing a formatter
# (e.g. Spotless) is deferred until the team adopts one. See docs/conventions.md.

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  go-service:
    name: Payment Service (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/payment-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Verify Go formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following Go files are not formatted with gofmt:"
            echo "$UNFORMATTED"
            echo "Run 'gofmt -w .' locally to fix them."
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: Go build
        run: go build -v ./...

      - name: Go test
        run: go test -v -race ./...

  java-services:
    name: Java Services (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - core-banking-service
          - identity-service

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Grant execute permission for Maven wrapper
        run: chmod +x mvnw

      # verify = compile + test + package: validates that the boot jar builds.
      - name: Compile, Test and Package with Maven
        run: ./mvnw clean verify

  migrations:
    name: Database Migrations (ephemeral PostgreSQL)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Compose mounts infra/local/postgres/init into the container, creating
      # the three roles and databases exactly as documented for local use.
      # (GitHub service containers cannot mount from the workspace because
      # they start before checkout.)
      - name: Create environment file
        run: cp .env.example .env

      - name: Start ephemeral PostgreSQL
        run: docker compose up -d --wait

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Grant execute permission for Maven wrapper
        run: chmod +x services/*/mvnw

      # Fresh environment: all three databases are created by the init script
      # and migrated from zero. Verifies FIN-003 acceptance criteria 5, 6 and 9.
      - name: Apply all migrations (first run)
        run: bash scripts/migrate-all.sh

      # Re-running must not re-apply anything (FIN-003 acceptance criterion 6).
      - name: Apply all migrations (second run, must be a no-op)
        run: bash scripts/migrate-all.sh

      # History tables must exist and record version 1 (FIN-003 criteria 4 and 9).
      - name: Verify migration history tables
        run: |
          echo "== identity_db: flyway_schema_history =="
          docker compose exec -T postgres psql -U fincore_admin -d identity_db -tAc \
            "SELECT version, description, success FROM flyway_schema_history ORDER BY installed_rank"
          echo "== core_banking_db: flyway_schema_history =="
          docker compose exec -T postgres psql -U fincore_admin -d core_banking_db -tAc \
            "SELECT version, description, success FROM flyway_schema_history ORDER BY installed_rank"
          echo "== payment_db: goose_db_version =="
          docker compose exec -T postgres psql -U fincore_admin -d payment_db -tAc \
            "SELECT version_id, is_applied FROM goose_db_version ORDER BY id"
