name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  go-service:
    name: Payment Service (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/payment-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Verify Go formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following Go files are not formatted with gofmt:"
            echo "$UNFORMATTED"
            echo "Run 'gofmt -w .' locally to fix them."
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: Go build
        run: go build -v ./...

      - name: Go test
        run: go test -v -race ./...

  java-services:
    name: Java Services (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - core-banking-service
          - identity-service

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Grant execute permission for Maven wrapper
        run: chmod +x mvnw

      - name: Compile and Test with Maven
        run: ./mvnw clean test
