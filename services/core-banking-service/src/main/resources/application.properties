spring.application.name=core-banking-service

# Migrations run explicitly through the Flyway Maven plugin (./mvnw flyway:migrate),
# never as a side effect of starting the service.
spring.flyway.enabled=false

# HTTP server
server.port=${SERVER_PORT:8080}

# Database connection (service-specific, loaded from environment)
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${CORE_BANKING_DB_NAME:core_banking_db}
spring.datasource.username=${CORE_BANKING_DB_USER:core_banking_user}
spring.datasource.password=${CORE_BANKING_DB_PASSWORD:}
