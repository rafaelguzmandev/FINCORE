spring.application.name=identity-service

# Migrations run explicitly through the Flyway Maven plugin (./mvnw flyway:migrate),
# never as a side effect of starting the service.
spring.flyway.enabled=false

# HTTP server
server.port=${SERVER_PORT:8080}

# Database connection (service-specific, loaded from environment)
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${IDENTITY_DB_NAME:identity_db}
spring.datasource.username=${IDENTITY_DB_USER:identity_user}
spring.datasource.password=${IDENTITY_DB_PASSWORD:}
