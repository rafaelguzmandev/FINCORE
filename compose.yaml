
services:
  postgres:
    image: postgres:17
    container_name: fincore-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

      IDENTITY_DB_USER: ${IDENTITY_DB_USER}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}

      CORE_BANKING_DB_USER: ${CORE_BANKING_DB_USER}
      CORE_BANKING_DB_PASSWORD: ${CORE_BANKING_DB_PASSWORD}

      PAYMENT_DB_USER: ${PAYMENT_DB_USER}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/local/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
    name: fincore_postgres_data
